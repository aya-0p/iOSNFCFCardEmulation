name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check tracked source
        run: bash scripts/check-source.sh
      - name: Validate shell syntax
        run: |
          bash -n scripts/build.sh scripts/build-ios-ci.sh scripts/test.sh scripts/benchmark.sh scripts/check-source.sh
          sh -n scripts/iosnfcfctl Packaging/postinst Packaging/prerm Packaging/postrm
      - name: Run portable tests
        run: bash scripts/test.sh

  apple-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install packaging tools
        run: brew install dpkg ldid
      - name: Install Theos
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/theos/theos.git "$THEOS"
          "$THEOS/bin/bootstrap.sh"
          mkdir -p "$THEOS/sdks"
          ln -s "$(xcrun --sdk iphoneos --show-sdk-path)" "$THEOS/sdks/iPhoneOS17.5.sdk"
      - name: Build package
        env:
          THEOS: ${{ runner.temp }}/theos
          TARGET: arm64e-apple-ios17.6.1
        run: bash scripts/build.sh
      - name: Upload iOS arm64e package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iosnfcfcardemulation-ios17.6.1-arm64e
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14
